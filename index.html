<style>
/* Layout: app de obra mobile-first — cabeçalho navy com logo, abas inferiores no celular / topo no desktop, cartões só onde separam objetos. */
:root{
  --navy:#152737; --navy-2:#1f3a52; --ouro:#bf935b; --ouro-txt:#9a713d;
  --bg:#f2f3f1; --surface:#ffffff; --surface-2:#f7f7f4; --fg:#17212b; --muted:#5f6b76; --line:#dfe2e0;
  --ok:#1e7d47; --ok-bg:#e3f2e9; --warn:#a96400; --warn-bg:#fcefd9; --bad:#b4372a; --bad-bg:#f9e5e2; --info:#2b5bb8; --info-bg:#e6edfa;
  --f-disp:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1822; --surface:#16222e; --surface-2:#1b2937; --fg:#e7ebee; --muted:#9aa8b4; --line:#2a3a49;
  --ouro-txt:#d5ad79; --ok:#5cc48a; --ok-bg:#163526; --warn:#e3a54b; --warn-bg:#3a2a12; --bad:#ef8a7c; --bad-bg:#3d1d19; --info:#8eb0f0; --info-bg:#1a2a45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1822; --surface:#16222e; --surface-2:#1b2937; --fg:#e7ebee; --muted:#9aa8b4; --line:#2a3a49;
  --ouro-txt:#d5ad79; --ok:#5cc48a; --ok-bg:#163526; --warn:#e3a54b; --warn-bg:#3a2a12; --bad:#ef8a7c; --bad-bg:#3d1d19; --info:#8eb0f0; --info-bg:#1a2a45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
header.top img{height:34px;width:auto}
header.top .obra{border-left:1px solid rgba(255,255,255,.2);padding-left:14px;min-width:0}
header.top .obra b{font-family:var(--f-disp);font-size:19px;font-weight:600;display:block;line-height:1.1}
header.top .obra span{font-size:12.5px;color:#b9c6d3}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs button{background:none;border:0;color:#cfd8e2;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
nav.tabs button[aria-current="page"]{background:var(--ouro);color:#fff}
nav.tabs button:focus-visible,.btn:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
main{padding-block:18px 96px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.sec{margin-block:0 22px}
.sec>h2{font-size:21px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.sec>h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{font-family:var(--f-disp);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;display:block}
.kpi span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.lista{display:flex;flex-direction:column;gap:8px}
.rdo-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.rdo-item:hover{border-color:var(--ouro)}
.data-box{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.data-box b{font-family:var(--f-disp);font-size:26px;line-height:1;display:block}
.data-box span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rdo-item .t{min-width:0}
.rdo-item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdo-item .t span{font-size:13.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-fotos{display:flex;gap:4px}
.mini-fotos img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-info{background:var(--info-bg);color:var(--info)}.c-neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.vazio{padding:28px 10px;text-align:center;color:var(--muted)}
.vazio b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
/* detalhe */
.det-cab{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.det-cab h1{font-size:28px;line-height:1.1}
.det-cab .sub{color:var(--muted);font-size:14px}
.det-cab .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ouro{background:var(--ouro);border-color:var(--ouro);color:#fff}
.btn.peq{padding:5px 10px;font-size:13px}
.voltar{background:none;border:0;color:var(--ouro-txt);font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
.clima{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.4fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.clima>div{background:var(--surface);padding:10px 12px}
.clima .p{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.clima .v{font-weight:600}
.clima .c{font-size:13px}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.serv{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:6px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.serv:last-child{border-bottom:0}
.serv .loc{font-size:12.5px;color:var(--ouro-txt);font-weight:600}
.serv .d{font-weight:600}
.barra{height:7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--ouro)}
.txt{white-space:pre-wrap}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.foto{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:zoom-in;text-align:left;padding:0;display:block;width:100%}
.foto img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface-2)}
.foto figcaption{padding:7px 9px 9px;font-size:13px}
.foto figcaption b{display:block;font-size:12px;color:var(--ouro-txt);font-weight:600}
.foto figcaption span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.grupo{grid-column:1/-1;font-family:var(--f-disp);font-size:17px;font-weight:600;padding-top:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros select,.filtros input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;flex:1 1 160px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ouro);color:#fff;border-color:var(--ouro)}
.pavs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pav{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pav h3{font-size:17px;margin-bottom:6px}
.pav ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
header.top .obra{flex:1 1 auto}
header.top .obra b,header.top .obra span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:761px) and (max-width:1100px){header.top .obra span{display:none}nav.tabs button{padding:8px 9px}}
header.top .obra img.logo-viva{height:44px;width:auto;display:block}
@media (max-width:760px){header.top .obra img.logo-viva{height:36px}}
.tema{flex:none;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:20px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tema:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
@media (max-width:760px){.tema{margin-left:auto;padding:7px 10px;font-size:16px}.tema .lbl{display:none}header.top .obra span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
/* início */
:root{--trilho:#e6e3dc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--trilho:#26364a}}
:root[data-theme="dark"]{--trilho:#26364a}
.rosca{display:block;flex:none}
.rosca-n{fill:var(--fg);font-family:var(--f-disp);font-weight:600;font-variant-numeric:tabular-nums}
.ini-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:22px}
.ini-geral{display:flex;gap:22px;align-items:center}
.ini-geral h1{font-size:30px;line-height:1.1;margin:2px 0 6px}
.ini-geral p{margin:0 0 4px}
.mut{color:var(--muted)}
.ini-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.roscas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.et{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px 12px;cursor:pointer;color:var(--fg)}
.et:hover,.et[aria-expanded="true"]{border-color:var(--ouro)}
.et b{font-size:14px;line-height:1.25;font-weight:600;min-height:2.5em;display:flex;align-items:center}
.et .peso{font-size:12px}
.et-det{margin-top:12px;border-color:var(--ouro)}
.et-det-c{display:flex;gap:14px;align-items:flex-start}
.et-det h3{font-size:19px;margin-bottom:4px}
.et-det p{margin:0;color:var(--muted)}
.torre{padding:10px 12px}
.andar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 42px;gap:8px;align-items:center;padding:2px 0;font-size:12.5px}
.an-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.an-b{height:10px;background:var(--trilho);border-radius:3px;overflow:hidden}
.an-b i{display:block;height:100%;background:var(--ouro);border-radius:3px}
.an-p{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.chao{border-top:3px solid var(--muted);margin-top:6px;padding-top:6px;font-size:12px;color:var(--muted)}
@media (max-width:760px){.ini-geral{flex-direction:column;align-items:flex-start;gap:12px}.ini-geral .rosca{width:140px;height:140px}.roscas{grid-template-columns:repeat(2,minmax(0,1fr))}.et-det-c .rosca{display:none}.ini-baixo table.t{font-size:13.5px}.ini-baixo table.t td,.ini-baixo table.t th{padding:6px 4px}.sec>h2{flex-wrap:wrap;row-gap:2px}nav.tabs button{font-size:12px;padding:9px 2px}}
/* projeto */
.prs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pr{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;cursor:pointer;text-align:left;width:100%}
.pr:hover{border-color:var(--ouro)}
.pr img{width:100%;aspect-ratio:2/1;object-fit:cover;object-position:left center;background:#fff;border-bottom:1px solid var(--line)}
.pr-t{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.pr-t b{font-family:var(--f-disp);font-size:18px;font-weight:600}
.pr-t>span:last-child{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vw{position:relative;height:min(64vh,620px);background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.vw:active{cursor:grabbing}
.vw.cheia{position:fixed;inset:0;height:auto;z-index:70;border-radius:0;border:0}
body.sem-rolar{overflow:hidden}
.vw-in{position:absolute;left:0;top:0;transform-origin:0 0;--s:1}
.vw-in img{display:block;max-width:none;height:auto}
.vw-bt{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.vw-bt button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--navy);color:#fff;font-size:20px;cursor:pointer;line-height:1}
.vw.cheia .vw-bt{top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px))}
.vw-dica{position:absolute;left:10px;bottom:8px;font-size:12px;color:#5f6b76;background:rgba(255,255,255,.88);padding:3px 8px;border-radius:6px;pointer-events:none}
.pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid var(--ouro);box-shadow:0 0 0 4px rgba(191,147,91,.35);transform:scale(calc(1 / var(--s)));pointer-events:none}
@media (prefers-reduced-motion:no-preference){.pin{animation:pul 1.2s ease-out infinite}@keyframes pul{50%{box-shadow:0 0 0 14px rgba(191,147,91,0)}}.vw-in{transition:transform .25s ease}.vw:active .vw-in{transition:none}}
.lg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.lg-g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px}
.lg-g h3{font-size:16px;margin:0 0 6px;color:var(--ouro-txt)}
.lgs{list-style:none;margin:0;padding:0}
.lg{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;color:var(--fg)}
.lgs li:first-child .lg{border-top:0}
.lg[data-sem]{cursor:default}
.lg[aria-pressed="true"]{background:var(--surface-2);border-radius:8px}
.lg-ic{width:34px;height:34px;border-radius:8px;background:var(--info-bg);color:var(--navy-2);display:grid;place-items:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-ic{color:var(--info)}}
:root[data-theme="dark"] .lg-ic{color:var(--info)}
.lg-cor{width:22px;height:22px;border-radius:50%;margin:6px;border:1px solid rgba(0,0,0,.15)}
.lg-pad{width:34px;height:34px;border-radius:8px;border:1px solid var(--line)}
.lg-jardim{background:#7ac143}
.lg-aterro{background:repeating-linear-gradient(45deg,#c9a27a 0 1.5px,#f5ece2 1.5px 6px),repeating-linear-gradient(-45deg,#c9a27a 0 1.5px,transparent 1.5px 6px);background-blend-mode:multiply}
.lg-t b{display:block;font-weight:600;font-size:14.5px}
.lg-t span{display:block;font-size:13.5px;color:var(--muted)}
.lg-ver{color:var(--ouro-txt);padding-top:4px}
.simb summary{cursor:pointer}
.simb .lgs{margin-top:8px}
@media (max-width:760px){.vw{height:56vh}.lg-grid{grid-template-columns:minmax(0,1fr)}.vw-dica{display:none}}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(6,10,15,.94);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:calc(100% - 120px);object-fit:contain;border-radius:4px}
.lb .inf{color:#e7ebee;text-align:center;margin-top:12px;max-width:760px;font-size:14.5px}
.lb .inf b{color:#d5ad79}
.lb button{position:absolute;background:rgba(255,255,255,.14);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
.lb .x{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.lb .a{left:max(10px,env(safe-area-inset-left,0px));top:50%}.lb .p2{right:max(10px,env(safe-area-inset-right,0px));top:50%}
/* edição */
.edit input,.edit select,.edit textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
.edit textarea{min-height:70px;resize:vertical}
.edit label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.linha{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 70px 34px;gap:6px;margin-bottom:6px}
.linha-at{display:grid;grid-template-columns:minmax(0,1fr) 72px 140px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.x-btn{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer}
.barra-salvar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;border-radius:var(--r) var(--r) 0 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;z-index:60}
.rodape{color:var(--muted);font-size:12.5px;margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:760px){
  header.top img{height:28px}
  header.top .obra b{font-size:17px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--navy);justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:20}
  nav.tabs button{flex:1;font-size:13px;padding:9px 4px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .duas{grid-template-columns:minmax(0,1fr)}
  .clima{grid-template-columns:repeat(3,minmax(0,1fr))}
  .clima .obs{grid-column:1/-1}
  .rdo-item{grid-template-columns:56px minmax(0,1fr)}

<main class="wrap" id="app">
  <div class="vazio" id="carregando"><b>Carregando o diário da obra…</b>Os diários, fotos e serviços aparecem aqui assim que os dados chegarem.</div>
</main>
<div id="lbRoot"></div>

<script>
'use strict';
/* tema: automático (segue o aparelho) / claro / escuro */
const TEMAS=[['auto','◐','Automático'],['light','☀','Claro'],['dark','☾','Escuro']];
function lerTema(){try{return localStorage.getItem('viva-tema')||'auto';}catch(_){return 'auto';}}
function aplicarTema(t){const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  const b=document.getElementById('tema');if(b){const x=TEMAS.find(y=>y[0]===t)||TEMAS[0];b.innerHTML=`<span aria-hidden="true">${x[1]}</span><span class="lbl">${x[2]}</span>`;b.title='Tema: '+x[2]+' (toque para trocar)';}}
aplicarTema(lerTema());
document.getElementById('tema').addEventListener('click',()=>{const a=lerTema();const t=TEMAS[(TEMAS.findIndex(y=>y[0]===a)+1)%TEMAS.length][0];try{localStorage.setItem('viva-tema',t);}catch(_){}aplicarTema(t);});
const S={obra:null,rdos:[],pend:[],view:'inicio',det:null,edit:false,canEdit:false,db:null,assets:null,galPav:'',galBusca:'',ok:false};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dt=d=>new Date(d+'T12:00');
const fmt=d=>d?d.split('-').reverse().join('/'):'';
const hoje=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const n=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isFinite(x)?x:0;};
const efetivo=r=>(r.efetivo||[]).reduce((s,e)=>s+n(e.qtd),0);
const ICON={Bom:'☀️',Nublado:'☁️',Chuvoso:'🌧️'};
const PER=[['manha','Manhã'],['tarde','Tarde'],['noite','Noite']];
const SIT=['Não iniciada','Iniciada','Em andamento','Concluída','Paralisada'];
const src=f=>f.asset?('/_blob/'+f.asset):(f.url||'');
const BUN={};
function pacote(kind,rid){const k=kind+'/'+rid;return BUN[k]||(BUN[k]=fetch(kind+'/'+encodeURIComponent(rid)+'.json').then(r=>r.ok?r.json():{}).catch(()=>({})));}
async function fotoSrc(f,full){if(!f.arquivo)return '';return (full?'fotos/':'mini/')+encodeURIComponent(f.arquivo);}
function imgTag(f,extra=''){return `<img src="mini/${esc(encodeURIComponent(f.arquivo||''))}" loading="lazy" ${extra}>`;}
const OBS=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){OBS.unobserve(e.target);carregarImg(e.target);}}),{rootMargin:'400px'}):null;
async function carregarImg(im){const m=await pacote('mini',im.dataset.rid);const s=m[im.dataset.arq];if(s)im.src=s;}
function hidratar(){document.querySelectorAll('img[data-arq]:not([src])').forEach(im=>OBS?OBS.observe(im):carregarImg(im));}
const pavDe=l=>String(l||'').split(' – ')[0].trim();
const chipStatus=s=>`<span class="chip ${s==='Aprovado'?'c-ok':s==='Em revisão'?'c-info':'c-warn'}">${esc(s||'Rascunho')}</span>`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

/* ---------- navegação ---------- */
const VIEWS=['inicio','painel','diarios','fotos','projeto','obra'];
function ir(v,det){S.view=v;S.det=det||null;S.edit=false;if(v!=='projeto')S.pr=null;
  const hh=det?'#rdo-'+det:(v==='projeto'&&S.pr?'#prancha-'+S.pr:'#'+v);
  try{history.replaceState(null,'',hh);}catch(_){location.hash=hh.slice(1);}
  render();window.scrollTo(0,0);}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.v==='projeto')S.pr=null;ir(b.dataset.v);}});
function lerHash(){const h=location.hash.slice(1);if(h.startsWith('prancha-')){S.view='projeto';S.det=null;S.pr=+h.slice(8);return;}if(h==='projeto')S.pr=null;if(h.startsWith('rdo-')){S.view='diarios';S.det=h.slice(4);}else if(VIEWS.includes(h)){S.view=h;S.det=null;}}
window.addEventListener('hashchange',()=>{lerHash();render();});

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>{if(b.dataset.v===S.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const app=$('#app');
  if(!S.ok){app.innerHTML=$('#carregando')?.outerHTML||'';return;}
  if(S.view==='diarios'&&S.det){app.innerHTML=S.edit?viewEditar():viewDetalhe();ligarDetalhe();hidratar();return;}
  app.onclick=null;window.onresize=null;
  if(S.view==='projeto'){app.innerHTML=(S.pr?viewPrancha():viewProjeto())+rodape();if(S.pr)ligarPrancha();return;}
  app.innerHTML=({inicio:viewInicio,painel:viewPainel,diarios:viewDiarios,fotos:viewFotos,obra:viewObra})[S.view]()+rodape();
  if(S.view==='fotos')ligarFotos();
  hidratar();
}
const ordenados=()=>[...S.rdos].sort((a,b)=>b.data.localeCompare(a.data)||(b.numero||0)-(a.numero||0));
const todasFotos=()=>ordenados().flatMap(r=>(r.fotos||[]).map(f=>({...f,rid:r.id,data:r.data,numero:r.numero})));
function rodape(){const u=ordenados()[0];return `<div class="rodape">Terral Construtora · Residencial Vivá${u?` · última atualização em ${fmt(u.data)}`:''}${S.obra?.drive?` · <a href="${esc(S.obra.drive)}" target="_blank" rel="noopener" style="color:var(--ouro-txt)">cópia no Google Drive</a>`:''}</div>`;}

function itemRdo(r){
  const at=(r.atividades||[]).map(a=>a.descricao).filter(Boolean);
  const d=dt(r.data);
  return `<button class="rdo-item" data-rdo="${esc(r.id)}">
    <div class="data-box"><b>${d.getDate()}</b><span>${MESES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</span></div>
    <div class="t"><b>Nº ${r.numero||'—'} · ${esc(r.modelo||DIAS[d.getDay()])}</b>
      <span>${PER.map(([p])=>ICON[r.clima?.[p]?.tempo]||'').join(' ')} ${efetivo(r)?efetivo(r)+' pessoas · ':''}${at.length} serviço(s) · ${(r.fotos||[]).length} foto(s)</span>
      <span>${esc(at.slice(0,3).join(' · '))}</span></div>
    <div class="mini-fotos">${(r.fotos||[]).slice(0,3).map(f=>imgTag({...f,rid:r.id},'alt=""')).join('')}</div>
  </button>`;
}
function viewPainel(){
  const l=ordenados(), ult=l[0];
  const fotos=l.reduce((s,r)=>s+(r.fotos||[]).length,0);
  const chuva=l.filter(r=>PER.some(([p])=>r.clima?.[p]?.tempo==='Chuvoso')).length;
  const mes=hoje().slice(0,7), doMes=l.filter(r=>r.data.startsWith(mes)).length;

const linhaEf=(e,i)=>`<div class="linha" data-ef="${i}"><input placeholder="Empresa" value="${esc(e.empresa||'')}" data-k="empresa" aria-label="Empresa"><input placeholder="Função" value="${esc(e.funcao||'')}" data-k="funcao" aria-label="Função"><input type="number" min="0" inputmode="numeric" placeholder="Qtd." value="${esc(e.qtd||'')}" data-k="qtd" aria-label="Quantidade"><button class="x-btn" data-delef="${i}" aria-label="Remover">×</button></div>`;
let novas=[];
function reduzir(file){return new Promise((ok,er)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):er(new Error('falha')),'image/jpeg',.8);};im.onerror=()=>{URL.revokeObjectURL(u);er(new Error('imagem inválida'));};im.src=u;});}
function lerEf(){return [...document.querySelectorAll('#edEf .linha')].map(l=>{const o={};l.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value.trim());return o;}).filter(o=>o.funcao||o.empresa||o.qtd);}
function renderNovas(){const g=$('#edNovas');if(!g)return;const ls=S.obra?.locais||[];

/* ---------- eventos ---------- */
function ligarDetalhe(){
  const app=$('#app');
  app.onclick=async e=>{
    const t=e.target;
    if(t.closest('[data-back]')) return ir('diarios');
    if(t.closest('[data-editar]')){const r=S.rdos.find(x=>x.id===S.det);rascunho=JSON.parse(JSON.stringify(r));novas=[];S.edit=true;render();return;}
    if(t.closest('[data-cancelar]')){S.edit=false;novas.forEach(f=>URL.revokeObjectURL(f.prev));novas=[];render();return;}
    if(t.closest('[data-addef]')){rascunho.efetivo=[...lerEf(),{empresa:'',funcao:'',qtd:''}];const ef=$('#edEf');ef.innerHTML=rascunho.efetivo.map((x,i)=>linhaEf(x,i)).join('')+'<button class="btn peq" data-addef>+ Adicionar função</button>';return;}
    if(t.closest('[data-delef]')){t.closest('.linha').remove();return;}
    if(t.closest('[data-salvar]')) return salvar();
    const b=t.closest('[data-lb]'); if(b) abrirLb(b.dataset.lb==='det'?S._det:S._det,+b.dataset.i);
  };
  const inp=$('#edFotos'); if(inp) inp.onchange=async()=>{for(const f of inp.files){try{const blob=await reduzir(f);novas.push({blob,prev:URL.createObjectURL(blob),local:'',legenda:''});}catch(_){toast('Não foi possível ler '+f.name);}}inp.value='';renderNovas();};
  const g=$('#edNovas'); if(g) g.oninput=e=>{const i=e.target.dataset.nl??e.target.dataset.ng;if(i==null)return;if(e.target.dataset.nl!=null)novas[i].local=e.target.value;else novas[i].legenda=e.target.value;};
}
async function salvar(){
  const msg=$('#edMsg'); const r=rascunho;
  r.efetivo=lerEf();
  (r.atividades||[]).forEach((a,i)=>{const p=$('#pct'+i),s=$('#sit'+i);if(p)a.pct=p.value;if(s)a.situacao=s.value;if(a.situacao==='Concluída')a.pct='100';});
  r.ocorrencias=$('#edOc').value.trim(); r.observacoes=$('#edObs').value.trim(); r.status=$('#edSt').value;
  try{
    if(novas.length){
      if(!S.assets){msg.textContent='Este acesso não permite enviar fotos.';return;}
      for(const [i,f] of novas.entries()){msg.textContent=`Enviando foto ${i+1} de ${novas.length}…`;const up=await S.assets.upload(f.blob,{type:'image/jpeg'});(r.fotos=r.fotos||[]).push({asset:up.id,local:f.local.trim(),legenda:f.legenda.trim()});}
    }
    msg.textContent='Salvando…';
    r.atualizadoEm=new Date().toISOString();
    const {id,...corpo}=r; await S.db.collection('rdos').doc(S.det).set(corpo);
    novas.forEach(f=>URL.revokeObjectURL(f.prev));novas=[];S.edit=false;toast('Diário salvo');render();
  }catch(e){msg.textContent=e?.code==='quota_or_state'||e?.code==='quota_exceeded'?'O espaço do sistema está cheio.':'Não foi possível salvar. Verifique a conexão e tente de novo.';}
}

  const gm=$('#galMais'); if(gm) gm.onclick=()=>{const y=window.scrollY;S.galLim=(S.galLim||60)+60;render();window.scrollTo(0,y);};
  const bu=$('#galBusca'); let tm; bu.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{S.galBusca=bu.value;const pos=bu.selectionStart;render();const nb=$('#galBusca');nb.focus();nb.setSelectionRange(pos,pos);},300);};

});

/* visualizador com zoom */
const VZ={s:1,x:0,y:0,min:1};
function vzAplicar(){const el=$('#vwIn');if(el){el.style.transform=`translate(${VZ.x}px,${VZ.y}px) scale(${VZ.s})`;el.style.setProperty('--s',VZ.s);}}
function vzLimitar(){const vw=$('#vw'),im=$('#vwImg');if(!vw||!im)return;const W=vw.clientWidth,H=vw.clientHeight,w=im.offsetWidth*VZ.s,h=im.offsetHeight*VZ.s;
  VZ.x=w<=W?(W-w)/2:Math.min(0,Math.max(W-w,VZ.x));VZ.y=h<=H?(H-h)/2:Math.min(0,Math.max(H-h,VZ.y));}
function vzZoom(f,cx,cy){const vw=$('#vw');if(!vw)return;cx=cx??vw.clientWidth/2;cy=cy??vw.clientHeight/2;const ns=Math.min(8,Math.max(VZ.min,VZ.s*f));const r=ns/VZ.s;VZ.x=cx-(cx-VZ.x)*r;VZ.y=cy-(cy-VZ.y)*r;VZ.s=ns;vzLimitar();vzAplicar();}
function vzEncaixar(){const vw=$('#vw'),im=$('#vwImg');if(!vw||!im||!im.offsetWidth)return;VZ.min=Math.min(1,vw.clientWidth/im.offsetWidth,vw.clientHeight/im.offsetHeight);VZ.s=VZ.min;VZ.x=0;VZ.y=0;vzLimitar();vzAplicar();}
function vzFoco(px,py){const vw=$('#vw'),im=$('#vwImg');const s=Math.max(VZ.min*2.6,Math.min(VZ.s,6));VZ.s=s;VZ.x=vw.clientWidth/2-px*im.offsetWidth*s;VZ.y=vw.clientHeight/2-py*im.offsetHeight*s;vzLimitar();vzAplicar();}
function ligarPrancha(){
  const p=PR.find(q=>q.n===S.pr); if(!p)return;
  const vw=$('#vw'),im=$('#vwImg'),pins=$('#vwPins');
  const W=1600; im.style.width=W+'px';
  const cheio=new Image();cheio.onload=()=>{if($('#vwImg')===im)im.src=cheio.src;};cheio.src=im.dataset.full;
  const pronto=()=>vzEncaixar(); if(im.complete)requestAnimationFrame(pronto); else im.onload=pronto;
  window.onresize=()=>{if($('#vw'))vzEncaixar();};
  const pts=new Map();let ult=null,pinch=null,toque=0;
  vw.onpointerdown=e=>{if(e.target.closest('.vw-bt'))return;vw.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});ult={x:e.clientX,y:e.clientY};
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}
    const agora=Date.now();if(e.pointerType!=='mouse'&&agora-toque<300){const r=vw.getBoundingClientRect();vzZoom(2,e.clientX-r.left,e.clientY-r.top);}toque=agora;};
  vw.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=vw.getBoundingClientRect();vzZoom(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch.d=d;return;}
    if(pts.size===1&&ult){VZ.x+=e.clientX-ult.x;VZ.y+=e.clientY-ult.y;ult={x:e.clientX,y:e.clientY};vzLimitar();vzAplicar();}};
  const fim=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===1)ult=[...pts.values()][0];};
  vw.onpointerup=fim;vw.onpointercancel=fim;
  vw.onwheel=e=>{e.preventDefault();const r=vw.getBoundingClientRect();vzZoom(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top);};
  vw.ondblclick=e=>{const r=vw.getBoundingClientRect();vzZoom(2,e.clientX-r.left,e.clientY-r.top);};
  vw.querySelector('.vw-bt').onclick=e=>{const b=e.target.closest('button');if(!b)return;const z=b.dataset.z;
    if(z==='fs'){vw.classList.toggle('cheia');document.body.classList.toggle('sem-rolar',vw.classList.contains('cheia'));requestAnimationFrame(vzEncaixar);return;}
    if(z==='0')vzEncaixar();else vzZoom(z==='1'?1.5:1/1.5);};
  const itens=p.leg.flatMap(g=>g.it);
  $('#app').querySelectorAll('.lg').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;if(k.startsWith('s'))return;const x=itens[+k];if(!x||!x.p)return;
    $('#app').querySelectorAll('.lg[aria-pressed]').forEach(o=>o.removeAttribute('aria-pressed'));b.setAttribute('aria-pressed','true');
    const px=x.p[0]/p.w,py=x.p[1]/p.h;
    pins.innerHTML=`<span class="pin" style="left:${px*100}%;top:${py*100}%"></span>`;
    vzFoco(px,py);vw.scrollIntoView({behavior:'smooth',block:'center'});});
}

function rosca(pct,tam=108,esp=10,rot=''){
  const r=(tam-esp)/2,c=2*Math.PI*r,v=Math.max(0,Math.min(100,+pct||0)),d=c*v/100;
  return `<svg class="rosca" viewBox="0 0 ${tam} ${tam}" width="${tam}" height="${tam}" role="img" aria-label="${esc(rot)} ${v}%">
   <circle cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" stroke="var(--trilho)" stroke-width="${esp}"/>
   ${v>0?`<circle cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" stroke="var(--ouro)" stroke-width="${esp}" stroke-linecap="${v<100?'round':'butt'}" stroke-dasharray="${d} ${c}" transform="rotate(-90 ${tam/2} ${tam/2})"/>`:''}
   <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="rosca-n" style="font-size:${tam*.24}px">${v}<tspan style="font-size:${tam*.13}px">%</tspan></text></svg>`;
}

function mostrarLb(){const f=LB[LI];if(!f)return;
  $('#lbRoot').innerHTML=`<div class="lb" role="dialog" aria-label="Foto"><button class="x" aria-label="Fechar">×</button>${LB.length>1?'<button class="a" aria-label="Anterior">‹</button><button class="p2" aria-label="Próxima">›</button>':''}
  <img id="lbImg" alt="${esc(f.legenda||'')}"><div class="inf"><b>${esc(f.local||'')}</b>${f.local&&f.legenda?' · ':''}${esc(f.legenda||'')}<br><span style="color:#9aa8b4">${fmt(f.data)} · diário nº ${f.numero} · ${LI+1} de ${LB.length}</span></div></div>`;
  const alvo=LI; fotoSrc(f,false).then(s=>{const im=$('#lbImg');if(im&&LI===alvo&&!im.src)im.src=s;}); fotoSrc(f,true).then(s=>{const im=$('#lbImg');if(im&&LI===alvo&&s)im.src=s;});
  const lb=$('#lbRoot .lb');
  lb.onclick=e=>{if(e.target.classList.contains('x')||e.target===lb)return fecharLb();if(e.target.classList.contains('a')){LI=(LI-1+LB.length)%LB.length;mostrarLb();}if(e.target.classList.contains('p2')){LI=(LI+1)%LB.length;mostrarLb();}};
}
function fecharLb(){$('#lbRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(!$('#lbRoot .lb'))return;if(e.key==='Escape')fecharLb();if(e.key==='ArrowRight'){LI=(LI+1)%LB.length;mostrarLb();}if(e.key==='ArrowLeft'){LI=(LI-1+LB.length)%LB.length;mostrarLb();}});

/* ---------- dados (versão do site: somente consulta) ---------- */
(async()=>{
  lerHash();
  try{
    const v='?v='+Date.now().toString(36).slice(0,-3);
    const [o,r]=await Promise.all([fetch('dados/obra.json'+v).then(x=>x.json()),fetch('dados/rdos.json'+v).then(x=>x.json())]);
    S.obra=o;S.rdos=r;S.canEdit=false;S.ok=true;render();
  }catch(e){$('#app').innerHTML=`<div class="vazio panel"><b>Não foi possível carregar o diário</b>Verifique a conexão e recarregue a página.</div>`;}
})();
</script>
